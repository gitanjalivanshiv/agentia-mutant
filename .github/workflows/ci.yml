name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Fakes and recorded fixtures only: CI never talks to Copado.
      - run: npm test
      # The offline quickstart a judge would run (Copado calls replayed from fixtures).
      - run: examples/quickstart/run.sh
